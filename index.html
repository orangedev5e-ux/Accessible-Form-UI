<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Form UI</title>

  <!-- CSS File -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1><b>Accessible Form UI</b></h1>
  
  <div class="container">
    <form class="form">
    <label class="lb"><b>Full Name</b></label><br>
    <input type="text" placeholder="What should we call you?" class="ip"><br>
    
    <label class="lb"><b>Email</b></label><br>
    <input type="text" placeholder="Jhon@doe.com" class="ip"><br>
    
    <label class="lb"><b>Enter Password</b></label><br>
    <input type="password" placeholder="xxxxxxxx" class="ip"><br>
    
    <label class="lb"><b>Confirm Password</b></label><br>
    <input type="password" placeholder="xxxxxxxx" class="ip"><br>
    
    <button class="btn"><b>Update Profile</b></button>
    
    </form>
    <div class="sidebar">
    <div class="percentage"><b>65%</b></div>
    <div class="line"><b>Profile Completeness</b></div>
    
    <div class="list">
      <p><s>Create account</s></p>
      <p><s>Update roadmap progress</s></p>
      <p><s>Setup public profile</s></p>
      <p>Complete your first project</p>
      <p>Invite your friends</p>
    </div>
    </div>
  
    
    
  </div>

  <!-- JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
